# This repo's own CI. Every PR and every push to main runs it, and it ends in
# the aggregate `ci` job, the only check the rulesets require.
name: self-test

on:
  pull_request:
  push:
    branches: [main]

# A newer push to a PR cancels its older run; runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # The action is bumped by Dependabot; the actionlint binary it installs
      # is pinned here and bumped by hand.
      - uses: raven-actions/actionlint@v2.2.0
        with:
          version: 1.7.12

  # The scripts and ruleset bodies. shellcheck and jq come preinstalled on the runner.
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck --version && shellcheck scripts/*.sh actions/*/*.sh fixtures/*/*.sh fixtures/*/bin/* fixtures/*/.github/ci/*.sh
      - name: Ruleset bodies are valid JSON
        run: |
          for file in rulesets/*.json; do
            jq -e . "$file" >/dev/null || { echo "::error file=$file::not valid JSON"; exit 1; }
          done

  # dependency-branch.yml's steps, run against scratch repos with a local bare
  # remote and a stand-in gh. Calling the workflow itself needs the app's key.
  dependency-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: fixtures/dependency-branch/test.sh

  # digest.yml's steps: the zone check across DST, collect against a stand-in gh,
  # render (splitting included) and post against a stand-in curl.
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: fixtures/digest/test.sh

  # --- Fixture harness -------------------------------------------------------
  # Each reusable workflow is called here by local path, against a small project
  # under fixtures/, and every such job is listed in `ci`'s needs.

  python-plain:
    uses: ./.github/workflows/python.yml
    with:
      working-directory: fixtures/python-plain

  python-plain-ty:
    uses: ./.github/workflows/python.yml
    with:
      working-directory: fixtures/python-plain
      typechecker: ty

  python-postgres-alembic:
    uses: ./.github/workflows/python.yml
    with:
      working-directory: fixtures/python-postgres-alembic
      postgres: "17"

  js-pnpm:
    uses: ./.github/workflows/js.yml
    with:
      working-directory: fixtures/js-pnpm

  # The default (last) stage runs as a non-root user and passes the smoke test.
  image-docker:
    uses: ./.github/workflows/image-check.yml
    with:
      name: fixture-docker
      context: fixtures/docker
      build-args: FIXTURE_VERSION=1.2.3

  # The same image without its USER line, which allow-root lets through. A job
  # that calls a reusable workflow can't take continue-on-error, so the failing
  # cases (root image without allow-root, a smoke script that exits 1) can't
  # live here without turning the run red. They are checked on a throwaway PR.
  image-docker-allow-root:
    uses: ./.github/workflows/image-check.yml
    with:
      name: fixture-docker-root
      context: fixtures/docker
      file: fixtures/docker/Dockerfile
      target: runtime-root
      build-args: FIXTURE_VERSION=1.2.3
      allow-root: true

  # The gate self-test: `ci` sees one job that succeeded and one that was
  # skipped, and must pass.

  gate-input-success:
    runs-on: ubuntu-latest
    steps:
      - run: echo "succeeds, so ci sees success"

  gate-input-skipped:
    # Never true. actionlint rejects a constant `if: false`.
    if: github.run_id == 0
    runs-on: ubuntu-latest
    steps:
      - run: echo "never runs, so ci sees skipped"

  # The gate decides each kind of result correctly. Every leg runs the gate over
  # a made-up `needs`. The gate step may fail (on purpose, in most legs), and the
  # step after it asserts which way it went.
  gate-cases:
    name: gate-cases (${{ matrix.case }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: failure
            needs: '{"build":{"result":"success","outputs":{}},"test":{"result":"failure","outputs":{}}}'
            expect: failure
          - case: cancelled
            needs: '{"build":{"result":"cancelled","outputs":{}}}'
            expect: failure
          # toJSON(needs.build) instead of toJSON(needs): no entry has a result.
          - case: not-the-needs-object
            needs: '{"result":"success","outputs":{}}'
            expect: failure
          - case: success-and-skipped
            needs: '{"build":{"result":"success","outputs":{}},"image":{"result":"skipped","outputs":{}}}'
            expect: success
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - id: gate
        uses: ./actions/gate
        continue-on-error: true
        with:
          needs: ${{ matrix.needs }}
      - name: Gate finished as ${{ matrix.expect }}
        env:
          OUTCOME: ${{ steps.gate.outcome }}
          EXPECT: ${{ matrix.expect }}
        run: |
          if [[ $OUTCOME != "$EXPECT" ]]; then
            echo "::error title=gate-cases::the gate finished as $OUTCOME, expected $EXPECT"
            exit 1
          fi

  # The only required check. List every other job in needs.
  ci:
    if: always()
    needs:
      - actionlint
      - scripts
      - dependency-branch
      - digest
      - python-plain
      - python-plain-ty
      - python-postgres-alembic
      - js-pnpm
      - image-docker
      - image-docker-allow-root
      - gate-input-success
      - gate-input-skipped
      - gate-cases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./actions/gate
        with:
          needs: ${{ toJSON(needs) }}

  # image-publish.yml, called the way the caller template calls it: only on
  # push to main, only after `ci` passed (a red `ci` skips this job), one at a
  # time and never cancelled (the workflow's tip check relies on that). Not in
  # `ci`'s needs: it runs after `ci`. The name shares image-docker's cache scope.
  publish:
    # Test ci's result itself. A bare condition gets an implicit success(),
    # which is false when any job upstream of ci was skipped (gate-input-skipped
    # always is), so publish would never run.
    if: ${{ !cancelled() && github.event_name == 'push' && needs.ci.result == 'success' }}
    needs: ci
    concurrency: { group: "publish-${{ github.ref }}", cancel-in-progress: false }
    permissions: { contents: read, packages: write }
    uses: ./.github/workflows/image-publish.yml
    with:
      image: ghcr.io/neuroticsasquat-ch/workflows-fixture
      name: fixture-docker
      context: fixtures/docker
      build-args: FIXTURE_VERSION=1.2.3
