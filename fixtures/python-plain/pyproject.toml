# Fixture for python.yml with no database. self-test.yml runs it twice: with
# pyright (the default) and with typechecker: ty.
[project]
name = "python-plain"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = ["pyright>=1.1.414", "pytest>=9.2.0", "ruff>=0.17.4", "ty>=0.0.99"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
